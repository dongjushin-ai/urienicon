name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 포맷 · 분석 · 테스트
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.6 # 개발 PC와 같은 버전
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test tool
      - run: flutter analyze
      - run: flutter test

  apk:
    name: 릴리스 APK (arm64)
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.6
          cache: true
      - run: flutter pub get
      # 서명 키가 아직 없어 Flutter 기본(디버그 키) 서명. 내 폰 테스트용이며 스토어 업로드 불가.
      - run: flutter build apk --release --target-platform android-arm64
      - uses: actions/upload-artifact@v7
        with:
          name: urienicon-arm64-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
